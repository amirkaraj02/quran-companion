name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Create required asset directories
        working-directory: flutter_app
        run: |
          mkdir -p assets/images assets/fonts assets/translations
          # Create placeholder font files so pubspec assets resolve
          touch assets/fonts/UthmanicHafs.ttf
          touch assets/fonts/IndoPakNastaleeq.ttf
          touch assets/fonts/NotoNaskhArabic.ttf
          touch assets/fonts/Amiri-Regular.ttf
          touch assets/images/.gitkeep
          touch assets/translations/.gitkeep

      - name: Create l10n.yaml
        working-directory: flutter_app
        run: |
          cat > l10n.yaml << 'YAML'
          arb-dir: lib/l10n
          template-arb-file: app_sq.arb
          output-localization-file: app_localizations.dart
          YAML

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Run code generation
        working-directory: flutter_app
        run: |
          dart run build_runner build --delete-conflicting-outputs || true

      - name: Generate localizations
        working-directory: flutter_app
        run: flutter gen-l10n || true

      - name: Analyze code
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos || true

      - name: Build debug APK
        working-directory: flutter_app
        run: flutter build apk --debug --no-shrink

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-companion-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Build release APK (unsigned)
        working-directory: flutter_app
        run: flutter build apk --release --no-shrink

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-companion-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Quran Companion v${{ github.run_number }}"
          body: "Automated build from commit ${{ github.sha }}"
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
