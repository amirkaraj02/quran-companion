name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # manual trigger button in GitHub UI

jobs:
  build-apk:
    name: Build Flutter APK & AAB
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java ────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Flutter ─────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      # ── 4. Dependencies ────────────────────────────────────────
      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      # ── 5. Generate localizations ──────────────────────────────
      - name: Generate l10n
        working-directory: flutter_app
        run: flutter gen-l10n

      # ── 6. Analyze ─────────────────────────────────────────────
      - name: Flutter analyze
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos || true

      # ── 7. Tests ───────────────────────────────────────────────
      - name: Flutter test
        working-directory: flutter_app
        run: flutter test || true

      # ── 8. Build debug APK (fast, no signing needed) ───────────
      - name: Build debug APK
        working-directory: flutter_app
        run: flutter build apk --debug --no-shrink

      # ── 9. Build release APK (unsigned) ────────────────────────
      - name: Build release APK (unsigned)
        working-directory: flutter_app
        run: flutter build apk --release --no-shrink

      # ── 10. Build AAB (Play Store) ─────────────────────────────
      - name: Build release AAB
        working-directory: flutter_app
        run: flutter build appbundle --release --no-shrink

      # ── 11. Upload artifacts ───────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-companion-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-companion-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: quran-companion-release-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ── Optional: create a GitHub Release on version tags ─────────
  release:
    name: Create GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: quran-companion-release-apk
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/app-release.apk
          name: "Quran Companion ${{ github.ref_name }}"
          body: |
            ## 🕌 Quran Companion ${{ github.ref_name }}
            
            ### Download
            - **app-release.apk** — install directly on Android
            
            ### What's new
            See commit history for changes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
