name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Write local.properties
        working-directory: flutter_app/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "flutter.sdk=$(which flutter | xargs dirname | xargs dirname)" >> local.properties

      - name: Create asset directories
        working-directory: flutter_app
        run: |
          mkdir -p assets/fonts assets/images assets/audio assets/translations
          touch assets/fonts/.gitkeep assets/images/.gitkeep

      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Generate localizations
        working-directory: flutter_app
        run: flutter gen-l10n

      - name: Verify localizations file exists
        working-directory: flutter_app
        run: |
          if [ ! -f lib/generated/l10n/app_localizations.dart ]; then
            echo "❌ lib/generated/l10n/app_localizations.dart missing!"
            exit 1
          fi
          echo "✅ Localizations file found"

      - name: Analyze (non-blocking)
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos || true

      - name: Build Debug APK
        working-directory: flutter_app
        run: flutter build apk --debug --no-shrink

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-companion-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Build Release APK (non-blocking)
        working-directory: flutter_app
        run: flutter build apk --release --no-shrink || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-companion-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
        continue-on-error: true
