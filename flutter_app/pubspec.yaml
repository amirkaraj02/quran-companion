name: quran_companion
description: Islamic Quran Companion & Daily Worship Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Network
  dio: ^5.4.0
  retrofit: ^4.1.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # Auth
  google_sign_in: ^6.2.1
  firebase_auth: ^4.15.0
  firebase_core: ^2.24.0

  # Quran / Audio
  just_audio: ^0.9.36
  audio_service: ^0.18.12

  # Prayer Times
  adhan: ^1.1.2
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Qibla
  flutter_qiblah: ^2.1.3
  sensors_plus: ^4.0.2

  # Notifications
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2
  workmanager: ^0.5.2

  # UI
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^2.7.0
  fl_chart: ^0.66.0
  percent_indicator: ^4.2.3
  table_calendar: ^3.0.9

  # Utils
  intl: ^0.19.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  connectivity_plus: ^5.0.2
  permission_handler: ^11.2.0
  url_launcher: ^6.2.3
  package_info_plus: ^5.0.1
  flutter_compass: ^0.8.0
  device_info_plus: ^9.1.2
  http: ^1.2.0
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  retrofit_generator: ^8.1.0
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/translations/

  fonts:
    - family: Uthmani
      fonts:
        - asset: assets/fonts/UthmanicHafs.ttf
    - family: IndoPak
      fonts:
        - asset: assets/fonts/IndoPakNastaleeq.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
