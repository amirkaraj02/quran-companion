name: quran_companion
description: Islamic Quran Companion & Daily Worship Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Network
  dio: ^5.4.3+1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  shared_preferences: ^2.3.1

  # Auth (JWT only, no Firebase)
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.2

  # Audio
  just_audio: ^0.9.40
  audio_service: ^0.18.14

  # Prayer Times
  adhan: ^1.1.2
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Qibla
  flutter_qiblah: ^2.1.3
  sensors_plus: ^5.0.1

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  workmanager: ^0.5.2

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  fl_chart: ^0.69.0
  percent_indicator: ^4.2.3
  table_calendar: ^3.1.2

  # Utils
  intl: ^0.19.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  connectivity_plus: ^6.0.5
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2
  flutter_compass: ^0.8.0
  device_info_plus: ^10.1.2
  http: ^1.2.2
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/translations/

  fonts:
    - family: Uthmani
      fonts:
        - asset: assets/fonts/UthmanicHafs.ttf
    - family: IndoPak
      fonts:
        - asset: assets/fonts/IndoPakNastaleeq.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
